name: Build USB Speaker

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phone-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install pyaudiowpatch numpy pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name UsbSpeakerPC pc/usb_speaker_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: pc-program-exe
          path: dist/UsbSpeakerPC.exe
